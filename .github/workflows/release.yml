name: Release

# A release is made by pushing a version tag (see RELEASING.md):
#   v0.3.0       a release
#   v0.3.0-rc.1  a pre-release (not offered by the in-app updater)
# Running the workflow by hand builds everything and uploads the files as a
# workflow artifact, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$crate" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate}"
              exit 1
            fi
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          case "$crate" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  windows:
    name: Windows build and installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Build
        run: cargo build --locked --release --bin relink
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) { choco install innosetup --no-progress -y }
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          # The AppId is written once, as windows-app-id in Cargo.toml.
          $appId = (Select-String -Path Cargo.toml -Pattern '^windows-app-id = "([0-9A-Fa-f-]{36})"').Matches[0].Groups[1].Value
          if (-not $appId) { throw "windows-app-id missing from Cargo.toml" }
          & $iscc "/DAppId=$appId" "/DAppVersion=${{ needs.check.outputs.version }}" "/DExe=$PWD\target\release\relink.exe" "/DOutputDir=$PWD\dist" packaging\windows\relink.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Test the installer (per-user, no administrator rights)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-setup.exe | Select-Object -First 1
          # The default folder: it must be inside the user's profile.
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Re-Link"
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-not (Test-Path "$dir\relink.exe")) { throw "relink.exe was not installed under $dir" }
          & "$dir\relink.exe" --version
          # The Start menu and desktop shortcuts (both per user).
          $desktop = [Environment]::GetFolderPath("Desktop")
          $startMenu = [Environment]::GetFolderPath("Programs")
          if (-not (Test-Path "$desktop\Re-Link.lnk")) { throw "no desktop shortcut" }
          if (-not (Test-Path "$startMenu\Re-Link.lnk")) { throw "no Start menu shortcut" }
          # Inno writes the uninstall entry under the AppId (windows-app-id in Cargo.toml).
          $appId = (Select-String -Path Cargo.toml -Pattern '^windows-app-id = "([0-9A-Fa-f-]{36})"').Matches[0].Groups[1].Value
          $id = "{$appId}_is1"
          $tail = "Microsoft\Windows\CurrentVersion\Uninstall\$id"
          if (-not (Test-Path -LiteralPath "HKCU:\Software\$tail")) { throw "no per-user (HKCU) uninstall entry" }
          if (Test-Path -LiteralPath "HKLM:\Software\$tail") { throw "the installer wrote to HKLM (needs administrator rights)" }
          if (Test-Path -LiteralPath "HKLM:\Software\WOW6432Node\$tail") { throw "the installer wrote to HKLM (needs administrator rights)" }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 2
          if (Test-Path "$dir\relink.exe") { throw "relink.exe was not removed" }
          if (Test-Path "$desktop\Re-Link.lnk") { throw "the desktop shortcut was not removed" }
          if (Test-Path "$startMenu\Re-Link.lnk") { throw "the Start menu shortcut was not removed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/relink.exe
            dist/*-setup.exe

  linux:
    name: Linux build (glibc 2.31, Ubuntu 20.04+)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries the UI links against, and zig
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
          python3 -m pip install --user ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: cargo-zigbuild
        run: cargo install --locked cargo-zigbuild --version 0.19.8
      # zig links against glibc 2.31, so the binaries run on Ubuntu 20.04 and newer.
      - name: Build
        run: |
          rustup target add x86_64-unknown-linux-gnu
          make linux-bin
      - name: Check the glibc floor
        run: |
          max=$(objdump -T target/x86_64-unknown-linux-gnu/release/relink target/x86_64-unknown-linux-gnu/release/relink-helper | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "highest glibc symbol: $max"
          [ "$(printf '%s\n' GLIBC_2.31 "$max" | sort -V | tail -1)" = "GLIBC_2.31" ]
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/x86_64-unknown-linux-gnu/release/relink
            target/x86_64-unknown-linux-gnu/release/relink-helper

  package:
    name: Package and publish
    needs: [check, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Package
        run: |
          python3 scripts/package.py --version "${{ needs.check.outputs.version }}" --out dist/release \
            --windows-exe parts/windows/target/release/relink.exe \
            --installer parts/windows/dist/relink-${{ needs.check.outputs.version }}-windows-x64-setup.exe \
            --linux-bin parts/linux/relink \
            --helper parts/linux/relink-helper
          ls -l dist/release
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/release/*
      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags="--generate-notes --verify-tag"
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then flags="$flags --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/release/* --title "Re-Link ${GITHUB_REF_NAME#v}" $flags
