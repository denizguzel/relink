[package]
name = "relink"
version = "0.5.0"
edition = "2024"
description = "Keeps browser connections on the FortiClient VPN split tunnel"
publish = false
default-run = "relink"

# The Windows installer's AppId (Inno Setup), the one place it is written:
# build.rs hands it to the code (the "Installed apps" entry) and the release
# workflow to ISCC. Never change it: Windows would see a different program.
[package.metadata.relink]
windows-app-id = "6F1D2B5A-3C47-4E0B-9A58-2D7E41C0B9A3"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune.git", rev = "39301f6793266450a057f270da06b048a689be96" }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "39301f6793266450a057f270da06b048a689be96" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "39301f6793266450a057f270da06b048a689be96" }
rune-i18n = { git = "https://github.com/anomalyco/rune.git", rev = "39301f6793266450a057f270da06b048a689be96" }
rune-notify = { git = "https://github.com/anomalyco/rune.git", rev = "39301f6793266450a057f270da06b048a689be96" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks downloaded updates against the release's SHA256SUMS.
sha2 = "0.10"
# Firefox bookmark backups (mozLz4 = LZ4 block with a size prefix).
lz4_flex = "0.11"

[build-dependencies]
rune-i18n = { git = "https://github.com/anomalyco/rune.git", rev = "39301f6793266450a057f270da06b048a689be96", features = ["codegen"] }
embed-resource = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_System_Threading",
] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
